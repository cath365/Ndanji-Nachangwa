name: Patch Featured Impact Images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Impact artwork to Home Featured Impact
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = ".cover{height:170px;background:linear-gradient(135deg,#c8d5eb,#f1dcaa);display:grid;place-items:center;font:2rem Anton;color:var(--navy);text-align:center;padding:20px}"
          new_css = ".cover{aspect-ratio:16/9;background:linear-gradient(135deg,#c8d5eb,#f1dcaa);display:grid;place-items:center;overflow:hidden;padding:0}.cover .recovered-art{width:100%;height:100%;display:grid;place-items:center;background:#f8efdc;color:#66758f;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.cover .recovered-art img{display:block;width:100%;height:100%;object-fit:cover;background:#f8efdc}"
          if old_css in s:
              s = s.replace(old_css, new_css, 1)

          replacements = {
              '<div class="cover">STEM-A-GIRL</div>': '<div class="cover"><div class="recovered-art" data-source="/assets/stem-a-girl-art.svg?v=7">Loading artwork…</div></div>',
              '<div class="cover">55 DAYS ACROSS ZAMBIA</div>': '<div class="cover"><div class="recovered-art" data-source="/assets/remp-scratch-art.svg?v=7">Loading artwork…</div></div>',
              '<div class="cover">TECHNOVATION GIRLS</div>': '<div class="cover"><div class="recovered-art" data-source="/assets/technovation-girls-art.svg?v=7">Loading artwork…</div></div>',
          }
          for old, new in replacements.items():
              s = s.replace(old, new, 1)

          loader = """<script>(function(){function bytesFromBase64(b64){b64=b64.replace(/[^A-Za-z0-9+/=]/g,'');var pad=(4-b64.length%4)%4;b64+='='.repeat(pad);var bin=atob(b64),len=bin.length,bytes=new Uint8Array(len);for(var i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);return bytes}document.querySelectorAll('.recovered-art[data-source]').forEach(async function(box){try{var r=await fetch(box.dataset.source,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);var text=await r.text();var marker='base64,';var start=text.indexOf(marker);if(start<0)throw new Error('No embedded image');var payload=text.slice(start+marker.length);var end=payload.lastIndexOf('\\"');if(end>0)payload=payload.slice(0,end);var bytes=bytesFromBase64(payload);if(bytes[0]!==255||bytes[1]!==216)throw new Error('Invalid JPEG');var url=URL.createObjectURL(new Blob([bytes],{type:'image/jpeg'}));var img=new Image();img.alt=box.closest('.project')?.querySelector('h3')?.textContent||'Featured impact artwork';img.onload=function(){box.textContent='';box.appendChild(img)};img.onerror=function(){box.textContent='Artwork unavailable'};img.src=url}catch(e){console.error('Featured impact artwork recovery failed',e);box.textContent='Artwork unavailable'}})})();</script>"""
          if 'Featured impact artwork recovery failed' not in s:
              s = s.replace('</body></html>', loader + '</body></html>')

          p.write_text(s, encoding='utf-8')

      - name: Commit Home Featured Impact artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No Featured Impact changes needed"
          else
            git commit -m "Show artwork in Home Featured Impact [skip ci]"
            git push
          fi
